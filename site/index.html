<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>BWatch 历史走势</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="brand-copy">
      <h1>BWatch 历史走势</h1>
      <p id="exportStatus">正在读取导出数据...</p>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" title="切换至夜间模式" aria-label="切换至夜间模式">
      <span aria-hidden="true">☾</span>
    </button>
    <div class="snapshot-badge" title="页面展示的是插件导出时的数据快照">
      <span class="status-dot"></span>导出快照
    </div>
  </header>

  <main class="workspace">
    <section class="control-band" aria-label="历史范围控制">
      <div class="control-field">
        <span class="field-heading">主播 / 直播场次</span>
        <div class="session-controls">
          <select id="roomSelect" aria-label="选择主播"><option value="">选择主播</option></select>
          <select id="sessionSelect" aria-label="选择直播场次" disabled><option value="">先选择主播</option></select>
          <button id="clearSession" class="command-button" type="button" hidden>清除</button>
        </div>
        <div id="sessionPeakTrend" class="session-peak-trend" hidden></div>
      </div>

      <div class="control-field scope-field">
        <span class="field-heading">筛选范围</span>
        <div id="scopeFilters" class="scope-filters" role="group" aria-label="筛选范围与合计曲线"></div>
      </div>

      <div class="control-field date-field">
        <span class="field-heading">历史日期</span>
        <div class="date-controls">
          <input id="dateInput" type="date" aria-label="历史日期">
          <div id="dateButtons" class="date-buttons" role="group" aria-label="可用历史日期"></div>
        </div>
      </div>

      <div class="control-field range-panel">
        <div class="range-heading">
          <span class="field-heading">时间范围</span>
          <output id="rangeLabel">00:00 - 23:59</output>
        </div>
        <div class="dual-range" id="dualRange">
          <div class="range-track"></div>
          <div class="range-fill" id="rangeFill"></div>
          <input id="rangeStart" type="range" min="0" max="1439" value="0" aria-label="开始时间">
          <input id="rangeEnd" type="range" min="0" max="1439" value="1439" aria-label="结束时间">
        </div>
      </div>

      <label class="control-field height-field">
        <span class="range-heading">
          <span class="field-heading">图表高度</span>
          <output id="heightLabel">480 px</output>
        </span>
        <input id="heightRange" type="range" min="160" max="640" step="20" value="480">
      </label>
    </section>

    <section id="notice" class="notice" hidden></section>

    <section class="chart-main">
        <div class="chart-titlebar">
          <div>
            <h2>在线人数</h2>
            <p id="chartSummary">等待数据</p>
          </div>
        </div>
        <div id="chartFrame" class="chart-frame" style="--chart-height: 480px">
          <svg id="chart" role="img" aria-label="BWatch 历史在线人数走势图"></svg>
          <div id="tooltip" class="tooltip" hidden></div>
          <div id="chartEmpty" class="chart-empty">暂无可显示的数据</div>
        </div>
        <div class="legend-panel" aria-label="图例">
          <div class="legend-actions">
            <button id="hideAll" type="button">隐藏全部</button>
            <button id="showAll" type="button">全部显示</button>
            <span id="legendCount">0 条曲线</span>
          </div>
          <div id="legend" class="legend-list"></div>
        </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
